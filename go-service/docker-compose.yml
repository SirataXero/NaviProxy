version: '3.8'

services:
  # NaviProxy - Navidrome Music Proxy Service
  naviproxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naviproxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - CONFIG_PATH=/app/data/config
      - DOWNLOAD_FOLDER=/music/library
      - NAVIDROME_URL=http://navidrome:4533
    volumes:
      - ./data/config:/app/data
      - music_data:/music/library
    depends_on:
      - redis
      - navidrome
    networks:
      - music-net

  # Navidrome Music Server
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    user: 1000:1000 # Run with appropriate user id
    ports:
      - "4533:4533"
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_BASEURL=""
    volumes:
      - ./data/navidrome:/data
      - music_data:/music:ro # Navidrome reads from the shared music folder
    networks:
      - music-net

  # Redis for sub-millisecond query and metadata caching
  redis:
    image: redis:7-alpine
    container_name: naviproxy-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - music-net

volumes:
  music_data:
    driver: local
  redis_data:
    driver: local

networks:
  music-net:
    driver: bridge
